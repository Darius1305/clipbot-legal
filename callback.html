<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>clipbot login</title><link rel="stylesheet" href="style.css">
<style>textarea{width:100%;height:7rem;font:14px monospace;background:transparent;color:inherit;border:1px solid var(--muted);border-radius:8px;padding:8px;box-sizing:border-box}
button{margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer}</style></head>
<body><main>
<h1>Fast fertig</h1>
<p>Kopiere die komplette Adresse unten und füge sie im Terminal ein, wo clipbot danach fragt.</p>
<textarea id="u" readonly></textarea>
<button id="c">Kopieren</button> <span id="ok"></span>
<p class="meta">Copy the address above and paste it into the clipbot terminal prompt.</p>
<script>
// clipbot waits on this PC (127.0.0.1:8765) for the login result; hand it over directly
if (location.search.includes('code=') || location.search.includes('error=')) {
  location.replace('http://127.0.0.1:8765/callback' + location.search);
}
const u=document.getElementById('u');u.value=location.href;
document.getElementById('c').onclick=async()=>{try{await navigator.clipboard.writeText(u.value)}catch(e){u.select();document.execCommand('copy')}document.getElementById('ok').textContent='Kopiert ✓'};
</script>
</main></body></html>
