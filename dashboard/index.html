<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>clipbot Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0a0f1d;
  --surface-1: #111a2e;
  --surface-2: #17223b;
  --border: #24314f;
  --text-primary: #f2f5fb;
  --text-secondary: #a9b4cc;
  --text-muted: #6f7b96;
  --brand: #a9d6ff;
  --brand-ink: #0a1424;
  --series-1: #3987e5;   /* TikTok */
  --series-2: #d95926;   /* YouTube */
  --grid: #1f2a44;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: light) {
  :root:where(:not([data-theme="dark"])) {
    color-scheme: light;
    --bg: #f3f5fa;
    --surface-1: #ffffff;
    --surface-2: #f6f8fc;
    --border: #dde3ee;
    --text-primary: #0b1020;
    --text-secondary: #4a5470;
    --text-muted: #7a849c;
    --brand: #1c5cab;
    --brand-ink: #ffffff;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --grid: #e8ecf4;
    --shadow: 0 1px 2px rgba(10,20,40,.06), 0 8px 24px rgba(10,20,40,.06);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f5fa; --surface-1: #ffffff; --surface-2: #f6f8fc; --border: #dde3ee;
  --text-primary: #0b1020; --text-secondary: #4a5470; --text-muted: #7a849c;
  --brand: #1c5cab; --brand-ink: #ffffff; --series-1: #2a78d6; --series-2: #eb6834; --grid: #e8ecf4;
  --shadow: 0 1px 2px rgba(10,20,40,.06), 0 8px 24px rgba(10,20,40,.06);
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 64px; }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.logo { font-family: "Luckiest Guy", Inter, sans-serif; font-size: clamp(34px, 6vw, 52px); line-height: 1; color: var(--brand);
  transform: skewX(-8deg); letter-spacing: .5px; text-shadow: 0 3px 0 rgba(0,0,0,.35); margin: 0; }
.sub { color: var(--text-secondary); margin: 6px 0 0; }
.updated { color: var(--text-muted); font-size: 13px; text-align: right; }
.updated b { color: var(--text-secondary); font-weight: 600; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 20px; }
.seg { display: inline-flex; background: var(--surface-1); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--text-secondary); font: inherit; font-size: 13px; font-weight: 600;
  padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.filters label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }

/* cards */
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { padding: 16px 18px; }
.kpi .label { color: var(--text-secondary); font-size: 13px; font-weight: 500; }
.kpi .value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .split { color: var(--text-muted); font-size: 12px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }
.dot.tt { background: var(--series-1); } .dot.yt { background: var(--series-2); }

h2 { font-size: 17px; margin: 0 0 12px; font-weight: 700; letter-spacing: -.01em; }
section { margin-bottom: 28px; }
.notice { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
  font-size: 13px; margin-bottom: 16px; display: flex; gap: 10px; align-items: flex-start; }
.notice b { color: var(--text-primary); }

/* channels */
.channels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.ch { padding: 18px; }
.ch-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ch-name { font-family: "Luckiest Guy", Inter, sans-serif; font-size: 26px; color: var(--brand); transform: skewX(-8deg); display: inline-block; }
.ch-links { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2);
  border: 1px solid var(--border); font-size: 12px; font-weight: 600; text-decoration: none; color: var(--text-secondary); }
.pill:hover { color: var(--text-primary); border-color: var(--text-muted); }
.ch-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ch-stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.ch-stat .p { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
.ch-stat .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ch-stat .m { font-size: 12px; color: var(--text-muted); }
.next { margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
.slots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.slot { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.slot.is-next { border-color: var(--brand); color: var(--text-primary); }

/* chart */
.chart-card { padding: 18px; }
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--text-secondary); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 260px; overflow: visible; }
.chart .axis text { fill: var(--text-muted); font-size: 11px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); min-width: 140px; opacity: 0; transition: opacity .1s; }
.tip .t { color: var(--text-muted); margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; color: var(--text-secondary); }
.tip .r b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
.empty { color: var(--text-muted); font-size: 14px; padding: 40px 0; text-align: center; }
details.table { margin-top: 10px; font-size: 13px; color: var(--text-secondary); }
details.table summary { cursor: pointer; color: var(--text-muted); }
details.table table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
details.table th, details.table td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--border); }
details.table th:first-child, details.table td:first-child { text-align: left; }

/* videos */
.vid-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.vid { overflow: hidden; display: flex; flex-direction: column; }
.thumb { position: relative; aspect-ratio: 9 / 12; background: linear-gradient(160deg, var(--surface-2), var(--bg)); overflow: hidden; }
.thumb img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-muted); font-family: "Luckiest Guy", sans-serif;
  font-size: 28px; transform: skewX(-8deg); text-align: center; padding: 20px; }
.badges { position: absolute; z-index: 2; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 6px; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(10,15,29,.82); color: #f2f5fb; backdrop-filter: blur(4px); }
.badge.top5 { background: var(--brand); color: #0a1424; }
.vid-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.vid-title { font-weight: 700; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vid-meta { font-size: 12px; color: var(--text-muted); }
.plat { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary);
  padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
.plat .nums { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
.plat .nums b { color: var(--text-primary); }
.plat a { font-weight: 700; text-decoration: none; color: var(--text-primary); }
.plat a:hover { text-decoration: underline; }
.status { font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--good); } .status.wait { color: var(--warning); } .status.err { color: var(--critical); }
details.clips { font-size: 12px; color: var(--text-secondary); margin-top: auto; }
details.clips summary { cursor: pointer; color: var(--text-muted); }
details.clips ol { margin: 6px 0 0; padding-left: 18px; }
details.clips li { margin: 2px 0; }
details.clips a { text-decoration: none; } details.clips a:hover { text-decoration: underline; }
select { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
footer { color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 40px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 520px) { .kpi .value { font-size: 24px; } .updated { text-align: left; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="logo">clipbot</h1>
      <p class="sub">Alle Kanäle, alle Videos, alle Zahlen</p>
    </div>
    <div class="updated" id="updated">lädt …</div>
  </header>

  <div class="filters" role="group" aria-label="Filter">
    <label>Kanal</label><div class="seg" id="f-channel"></div>
    <label>Plattform</label>
    <div class="seg" id="f-platform">
      <button data-v="all" aria-pressed="true">Alle</button>
      <button data-v="tiktok" aria-pressed="false">TikTok</button>
      <button data-v="youtube" aria-pressed="false">YouTube</button>
    </div>
  </div>

  <div id="notices"></div>

  <section class="kpis" id="kpis" aria-label="Kennzahlen"></section>

  <section>
    <h2>Kanäle</h2>
    <div class="channels" id="channels"></div>
  </section>

  <section class="card chart-card">
    <div class="chart-head">
      <h2 style="margin:0">Views über Zeit</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="chart" id="chart"></div>
    <details class="table"><summary>Als Tabelle anzeigen</summary><div id="chart-table"></div></details>
  </section>

  <section>
    <div class="vid-head">
      <h2 id="vid-title">Videos</h2>
      <select id="sort" aria-label="Sortierung">
        <option value="new">Neueste zuerst</option>
        <option value="views">Meiste Views</option>
        <option value="likes">Meiste Likes</option>
      </select>
    </div>
    <div class="grid" id="videos"></div>
  </section>

  <footer>clipbot · Daten von Buffer (TikTok) und der YouTube Data API · aktualisiert bei jedem Bot-Lauf</footer>
</div>

<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
const state = { channel: "all", platform: "all", sort: "new", data: null };
const fmt = new Intl.NumberFormat("de-DE");
const compact = new Intl.NumberFormat("de-DE", { notation: "compact", maximumFractionDigits: 1 });
const n = v => fmt.format(v || 0);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KIND = { top5: "Top 5", random: "Einzel-Clip" };
const PLAT = { tiktok: "TikTok", youtube: "YouTube" };

function tz() { return state.data?.timezone || "Europe/Berlin"; }
function fmtDate(iso, opts) { return iso ? new Date(iso).toLocaleString("de-DE", { timeZone: tz(), ...opts }) : "–"; }
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "gerade eben"; if (m < 60) return `vor ${m} Min.`;
  const h = Math.round(m / 60); if (h < 24) return `vor ${h} Std.`;
  return `vor ${Math.round(h / 24)} Tagen`;
}
function channels() { return state.data.channels.filter(c => state.channel === "all" || c.id === state.channel); }
function plats() { return state.platform === "all" ? ["tiktok", "youtube"] : [state.platform]; }
function postViews(p, ps = plats()) { return ps.reduce((s, k) => s + (p[k]?.views || 0), 0); }
function postLikes(p, ps = plats()) { return ps.reduce((s, k) => s + (p[k]?.likes || 0), 0); }

function seg(el, items, key) {
  el.innerHTML = items.map(([v, l]) => `<button data-v="${v}" aria-pressed="${state[key] === v}">${esc(l)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return; state[key] = b.dataset.v; render(); };
}

function renderNotices() {
  const d = state.data, out = [];
  if (!d.youtube_stats) out.push(`<div class="notice">ℹ️ <span><b>YouTube-Zahlen fehlen noch.</b> Dafür braucht der Bot einen YouTube-API-Key (GitHub-Secret <code>YOUTUBE_API_KEY</code>).</span></div>`);
  out.push(`<div class="notice">⏱️ <span>TikTok-Zahlen kommen über Buffer und werden dort etwa <b>einmal am Tag</b> aktualisiert. Neue Videos stehen anfangs auf 0.</span></div>`);
  document.getElementById("notices").innerHTML = out.join("");
}

function renderKpis() {
  const cs = channels(), ps = plats();
  const posts = cs.flatMap(c => c.posts);
  const sum = (k, p) => cs.reduce((s, c) => s + (c.totals[p]?.[k] || 0), 0);
  const tot = k => ps.reduce((s, p) => s + sum(k, p), 0);
  const split = k => ps.length > 1 ? `<div class="split"><span><span class="dot tt"></span>TikTok ${n(sum(k, "tiktok"))}</span><span><span class="dot yt"></span>YouTube ${n(sum(k, "youtube"))}</span></div>` : "";
  const videos = posts.filter(p => ps.some(k => p[k])).length;
  const views = tot("views");
  const best = [...posts].sort((a, b) => postViews(b) - postViews(a))[0];
  const tiles = [
    ["Videos", n(videos), `<div class="split">${cs.length} ${cs.length === 1 ? "Kanal" : "Kanäle"}</div>`],
    ["Views gesamt", n(views), split("views")],
    ["Likes", n(tot("likes")), split("likes")],
    ["Kommentare", n(tot("comments")), split("comments")],
    ["Ø Views / Video", n(videos ? Math.round(views / videos) : 0), best && postViews(best) ? `<div class="split">Bestes: ${esc(best.title.slice(0, 28))}</div>` : ""],
  ];
  document.getElementById("kpis").innerHTML = tiles.map(([l, v, s]) =>
    `<div class="card kpi"><div class="label">${l}</div><div class="value">${v}</div>${s}</div>`).join("");
}

function nextSlot(slots) {
  const now = new Date(), parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: tz(), hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(now).map(p => [p.type, p.value]));
  const cur = `${parts.hour}:${parts.minute}`;
  return slots.find(s => s.time > cur) || slots[0];
}

function renderChannels() {
  document.getElementById("channels").innerHTML = channels().map(c => {
    const nx = nextSlot(c.slots), yt = c.youtube || {};
    const stat = (p, label) => {
      const t = c.totals[p];
      return `<div class="ch-stat"><div class="p"><span class="dot ${p === "tiktok" ? "tt" : "yt"}"></span>${label}</div>
        <div class="n">${n(t.views)} <span class="m">Views</span></div>
        <div class="m">${n(t.posts)} Videos · ${n(t.likes)} Likes${p === "youtube" && yt.subscribers != null ? ` · ${n(yt.subscribers)} Abos` : ""}</div></div>`;
    };
    return `<div class="card ch">
      <div class="ch-head"><span class="ch-name">${esc(c.name)}</span><span class="vid-meta">${c.posts.length} Posts</span></div>
      <div class="ch-links">
        ${c.streamers.map(s => `<a class="pill" href="https://twitch.tv/${esc(s)}" target="_blank" rel="noopener">Twitch: ${esc(s)} ↗</a>`).join("")}
        ${c.tiktok?.url ? `<a class="pill" href="${esc(c.tiktok.url)}" target="_blank" rel="noopener">TikTok: @${esc(c.tiktok.handle)} ↗</a>` : ""}
        ${yt.url ? `<a class="pill" href="${esc(yt.url)}" target="_blank" rel="noopener">YouTube: ${esc(yt.title)} ↗</a>` : ""}
      </div>
      <div class="ch-stats">${stat("tiktok", "TikTok")}${stat("youtube", "YouTube")}</div>
      <div class="next">Zeitplan täglich</div>
      <div class="slots">${c.slots.map(s => `<span class="slot ${s === nx ? "is-next" : ""}" title="${s === nx ? "Nächster Post" : ""}">${s.time} · ${KIND[s.kind] || s.kind}</span>`).join("")}</div>
    </div>`;
  }).join("");
}

function historyRows() {
  const byDay = {};
  for (const c of channels()) for (const h of c.history) {
    byDay[h.day] ??= { tiktok: 0, youtube: 0 };
    byDay[h.day][h.platform] += h.views || 0;
  }
  return Object.entries(byDay).sort(([a], [b]) => a.localeCompare(b)).map(([day, v]) => ({ day, ...v }));
}

function renderChart() {
  const ps = plats(), rows = historyRows(), el = document.getElementById("chart");
  document.getElementById("legend").innerHTML = ps.length > 1 ? ps.map(p => `<span><span class="dot ${p === "tiktok" ? "tt" : "yt"}"></span>${PLAT[p]}</span>`).join("") : "";
  document.getElementById("chart-table").innerHTML = `<table><thead><tr><th>Tag</th>${ps.map(p => `<th>${PLAT[p]}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr><td>${r.day}</td>${ps.map(p => `<td>${n(r[p])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  if (rows.length < 2) { el.innerHTML = `<div class="empty">Der Verlauf erscheint ab dem zweiten Tag mit Daten.<br>Heute: ${ps.map(p => `${PLAT[p]} ${n(rows[0]?.[p] || 0)} Views`).join(" · ")}</div>`; return; }

  const W = el.clientWidth || 800, H = 260, m = { l: 48, r: 12, t: 12, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(1, ...rows.flatMap(r => ps.map(p => r[p])));
  const nice = (() => { const e = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / e) * e; })();
  const x = i => m.l + (rows.length === 1 ? iw / 2 : (i / (rows.length - 1)) * iw);
  const y = v => m.t + ih - (v / nice) * ih;
  const ticks = [0, .25, .5, .75, 1].map(f => f * nice);
  const step = Math.max(1, Math.ceil(rows.length / Math.floor(iw / 70)));
  const colors = { tiktok: "var(--series-1)", youtube: "var(--series-2)" };
  const lines = ps.map(p => `<path d="${rows.map((r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(r[p]).toFixed(1)}`).join("")}" fill="none" stroke="${colors[p]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  const last = ps.map(p => { const i = rows.length - 1; return `<text x="${x(i) - 4}" y="${y(rows[i][p]) - 8}" text-anchor="end" fill="var(--text-secondary)" font-size="11" font-weight="600">${compact.format(rows[i][p])}</text>`; }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Views pro Tag nach Plattform">
    <g class="axis">${ticks.map(t => `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${compact.format(t)}</text>`).join("")}
    ${rows.map((r, i) => i % step === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${r.day.slice(8, 10)}.${r.day.slice(5, 7)}.</text>` : "").join("")}</g>
    ${lines}${last}
    <line id="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    ${ps.map(p => `<circle class="mk" data-p="${p}" r="4.5" fill="${colors[p]}" stroke="var(--surface-1)" stroke-width="2" opacity="0"/>`).join("")}
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>
  </svg>`;
  const svg = el.querySelector("svg"), tip = document.getElementById("tip");
  const hide = () => { tip.style.opacity = 0; svg.querySelector("#xh").setAttribute("opacity", 0); svg.querySelectorAll(".mk").forEach(c => c.setAttribute("opacity", 0)); };
  svg.querySelector("#hit").addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((px - m.l) / iw * (rows.length - 1))));
    const row = rows[i];
    svg.querySelector("#xh").setAttribute("x1", x(i)); svg.querySelector("#xh").setAttribute("x2", x(i)); svg.querySelector("#xh").setAttribute("opacity", 1);
    svg.querySelectorAll(".mk").forEach(c => { c.setAttribute("cx", x(i)); c.setAttribute("cy", y(row[c.dataset.p])); c.setAttribute("opacity", 1); });
    tip.innerHTML = `<div class="t">${new Date(row.day).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })}</div>` +
      ps.map(p => `<div class="r"><span><span class="dot ${p === "tiktok" ? "tt" : "yt"}"></span>${PLAT[p]}</span><b>${n(row[p])}</b></div>`).join("");
    const left = r.left + window.scrollX + x(i) * (r.width / W);
    tip.style.left = Math.min(left + 12, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 16) + "px";
    tip.style.top = (r.top + window.scrollY + 8) + "px";
    tip.style.opacity = 1;
  });
  svg.querySelector("#hit").addEventListener("pointerleave", hide);
}

function statusOf(t) {
  if (!t) return "";
  if (t.status === "sent") return `<span class="status ok">live</span>`;
  if (t.status === "error") return `<span class="status err">Fehler</span>`;
  return `<span class="status wait">${t.status === "scheduled" || t.status === "buffer" ? "geplant" : "wird gesendet"}</span>`;
}

function platRow(p, d) {
  if (!d) return "";
  const link = d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">${PLAT[p]} ↗</a>` : `<span>${PLAT[p]}</span>`;
  return `<div class="plat"><span class="dot ${p === "tiktok" ? "tt" : "yt"}"></span>${link}
    <span class="nums"><span title="Views">▶ <b>${compact.format(d.views || 0)}</b></span><span title="Likes">♥ <b>${compact.format(d.likes || 0)}</b></span><span title="Kommentare">💬 <b>${compact.format(d.comments || 0)}</b></span></span></div>`;
}

function renderVideos() {
  const ps = plats();
  let posts = channels().flatMap(c => c.posts.map(p => ({ ...p, ch: c.name }))).filter(p => ps.some(k => p[k]));
  if (state.sort === "views") posts.sort((a, b) => postViews(b) - postViews(a));
  else if (state.sort === "likes") posts.sort((a, b) => postLikes(b) - postLikes(a));
  else posts.sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
  document.getElementById("vid-title").textContent = `Videos (${posts.length})`;
  document.getElementById("videos").innerHTML = posts.length ? posts.map(p => `
    <article class="card vid">
      <div class="thumb">
        ${p.thumb ? `<img src="${esc(p.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
        <div class="ph">${esc(p.ch)}</div>
        <div class="badges"><span class="badge ${p.kind}">${KIND[p.kind] || p.kind}</span><span class="badge">${esc(p.ch)}</span></div>
      </div>
      <div class="vid-body">
        <div class="vid-title">${esc(p.title)}</div>
        <div class="vid-meta">${fmtDate(p.tiktok?.published_at || p.created_at, { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })} ${statusOf(p.tiktok)}</div>
        ${ps.map(k => platRow(k, p[k])).join("")}
        ${p.clips?.length ? `<details class="clips"><summary>${p.clips.length === 1 ? "Original-Clip" : `${p.clips.length} Original-Clips`}</summary><ol ${p.kind === "top5" ? 'reversed' : ""}>${
          (p.kind === "top5" ? [...p.clips].reverse() : p.clips).map(c => `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a> · ${compact.format(c.views || 0)} Views</li>`).join("")}</ol></details>` : ""}
      </div>
    </article>`).join("") : `<div class="empty">Noch keine Videos für diese Auswahl.</div>`;
}

function render() {
  seg(document.getElementById("f-channel"), [["all", "Alle"], ...state.data.channels.map(c => [c.id, c.name])], "channel");
  document.querySelectorAll("#f-platform button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.platform));
  renderNotices(); renderKpis(); renderChannels(); renderChart(); renderVideos();
  const u = state.data.updated;
  document.getElementById("updated").innerHTML = `aktualisiert <b>${ago(u)}</b><br>${fmtDate(u, { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}`;
}

document.getElementById("f-platform").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.platform = b.dataset.v; render(); };
document.getElementById("sort").onchange = e => { state.sort = e.target.value; renderVideos(); };
window.addEventListener("resize", () => state.data && renderChart());

fetch("data.json?t=" + Date.now()).then(r => r.json()).then(d => { state.data = d; render(); })
  .catch(() => { document.getElementById("updated").textContent = "Daten konnten nicht geladen werden"; });
</script>
</body>
</html>
